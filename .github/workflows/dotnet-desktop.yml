# Builds and tests the Avalonia .NET desktop app on Windows, Linux and macOS.
# Runs on pushes and pull requests for every branch.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions

name: .NET Desktop

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  # Opt into Node.js 24 for JS-based actions still bundling Node 20 (e.g. upload-artifact).
  # Removes the Node.js 20 deprecation warnings. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        configuration: [ Debug, Release ]

    runs-on: ${{ matrix.os }}

    env:
      Solution_Name: src/Downloader.Desktop.sln
      Test_Project_Path: src/Downloader.Desktop.Tests/Downloader.Desktop.Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore "${{ env.Solution_Name }}"

    - name: Build
      run: dotnet build "${{ env.Solution_Name }}" --configuration ${{ matrix.configuration }} --no-restore

    - name: Test
      run: dotnet test "${{ env.Test_Project_Path }}" --configuration ${{ matrix.configuration }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
        path: ./TestResults
        if-no-files-found: ignore
