name: Extension

# Publishes the browser extension to Mozilla AMO (listing: downloader-browser-integration)
# automatically when its manifest version changes — Mozilla ONLY by design; Chrome/Edge stay a
# manual dashboard upload of the release-page zip. The job is version-gated and idempotent: a push
# that touches extension files without bumping the version is a green no-op (AMO rejects duplicate
# versions, so the gate keeps the workflow green instead of red).
#
# One-time setup (author): addons.mozilla.org/developers → "Manage API keys", then add the repo
# secrets AMO_JWT_ISSUER (the JWT issuer) and AMO_JWT_SECRET (the JWT secret). Until they exist the
# workflow skips with a notice instead of failing.
#
# "Automated" = submitted for review automatically; Mozilla review then publishes the version.
#
# History: an earlier version of this workflow (removed 2026-08-24) failed EVERY run from
# 2026-07-04 onward with "Content script defined in the manifest could not be found at content.js"
# — its "stage the Firefox source" step hand-copied a file list that had drifted from the manifest
# (missing content.js, later also missing options.html/css/js). It was deleted rather than fixed, so
# no version after 1.1.0 ever reached AMO. This version packages via scripts/build-extension.sh —
# the SAME zip a manual dashboard upload would use, whose own verify_zip already fails the build if
# a manifest reference is missing from the package — and additionally lints that exact package with
# `web-ext lint` (the same checker AMO's server runs) as its own failing step, so a broken package
# never reaches a real AMO submission attempt. See docs/codebase-index.md and PUBLISHING.md.
on:
  push:
    branches: [ develop, main ]
    paths: [ 'src/browser-extension/**' ]
  workflow_dispatch:

jobs:
  amo:
    name: Publish to Mozilla AMO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bump guard walks the manifest's own commits to find where the
          # current version was set.
          fetch-depth: 0

      - name: Read extension version
        id: ver
        run: |
          VER=$(python3 -c "import json; print(json.load(open('src/browser-extension/manifest.firefox.json'))['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Extension manifest version: $VER"

      - name: Skip if this version is already on AMO
        id: gate
        run: |
          SLUG="downloader-browser-integration"
          existing=$(curl -fsSL "https://addons.mozilla.org/api/v5/addons/addon/$SLUG/versions/?page_size=50" \
            | python3 -c "import json,sys; [print(v['version']) for v in json.load(sys.stdin).get('results', [])]" \
            || true)
          echo "Versions on AMO:"; echo "$existing" | sed 's/^/  /'
          if echo "$existing" | grep -qx "${{ steps.ver.outputs.version }}"; then
            echo "submit=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Extension ${{ steps.ver.outputs.version }} is already on AMO — nothing to submit."
          else
            echo "submit=yes" >> "$GITHUB_OUTPUT"
          fi

      # The version bump is manual (bump BOTH manifests). This guard catches the mistake that
      # silently strands users on an old build: extension CODE has changed since the manifest version
      # was last bumped, and that version is already published on AMO → fail with instructions.
      # Doc-only edits (*.md) stay green; manual dispatches skip it (there is nothing being pushed).
      #
      # The base is the commit that LAST SET the current version, not the push's 'before' commit.
      # Using 'before' made this step fail on every single release (2026-09-02, -03, -04): on `main`
      # the push is the release merge, whose base is the PREVIOUS release, so the diff spanned every
      # extension commit since then while the manifest already carried the version that `develop`
      # had published to AMO minutes earlier. It reported "code changed without a version bump" for
      # code that WAS published — a permanently red check, which is exactly how a real AMO failure
      # would go unnoticed. Asking "has anything changed since the bump?" is branch-independent and
      # is the question the guard actually wants answered.
      - name: Fail if code changed without a version bump
        if: github.event_name == 'push' && steps.gate.outputs.submit == 'no'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          MF="src/browser-extension/manifest.firefox.json"
          verat() { git show "$1:$MF" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true; }
          # Walk newest → oldest over commits touching the manifest; the last one still carrying this
          # version is the commit that introduced it.
          base=""
          for c in $(git log --format=%H "$GITHUB_SHA" -- "$MF"); do
            [ "$(verat "$c")" = "$VER" ] || break
            base="$c"
          done
          if [ -z "$base" ]; then
            echo "Could not locate the commit that set $VER — skipping the bump check rather than false-alarm."
            exit 0
          fi
          echo "Version $VER was set in $(git log --oneline -1 "$base")"
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" -- src/browser-extension | grep -v '\.md$' || true)
          if [ -n "$changed" ]; then
            echo "Extension code changed after the last version bump:"; echo "$changed" | sed 's/^/  /'
            echo "::error::src/browser-extension code changed but manifest version $VER is already published on AMO — bump \"version\" in BOTH manifest.json and manifest.firefox.json so the change actually ships."
            exit 1
          fi
          echo "Nothing changed since the bump — nothing to ship."

      - name: Check AMO credentials
        id: creds
        if: steps.gate.outputs.submit == 'yes'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::AMO secrets not configured (AMO_JWT_ISSUER / AMO_JWT_SECRET) — skipping the Mozilla submission. Create API keys at addons.mozilla.org/developers and add them as repo secrets."
            echo "## ⚠️ AMO publish skipped — secrets not configured" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The SAME zip a manual dashboard upload would use — see scripts/build-extension.sh. Its own
      # verify_zip already fails this step if a manifest reference (content_scripts, options_ui,
      # background, icons, ...) is missing from the package, which is exactly the class of bug that
      # broke every prior AMO submission. Building both targets here (not just Firefox) is
      # deliberate: it keeps this the one place both packages are ever assembled from source.
      - name: Build extension packages (scripts/build-extension.sh)
        if: steps.gate.outputs.submit == 'yes' && steps.creds.outputs.have == 'yes'
        run: ./scripts/build-extension.sh

      - name: Unpack the Firefox package for linting/signing
        if: steps.gate.outputs.submit == 'yes' && steps.creds.outputs.have == 'yes'
        run: |
          rm -rf /tmp/ext && mkdir -p /tmp/ext
          unzip -q dist/downloader-extension-firefox.zip -d /tmp/ext

      # The SAME linter AMO's server runs (addons-linter, via web-ext). Running it here fails this
      # job loudly — with the offending file named — instead of spending a submission attempt only
      # to have AMO reject it, which is how the prior workflow's failures went unnoticed for weeks.
      - name: Lint the packaged extension (same linter AMO runs)
        if: steps.gate.outputs.submit == 'yes' && steps.creds.outputs.have == 'yes'
        run: npx --yes web-ext@8 lint --source-dir /tmp/ext

      - name: Submit to AMO (listed channel)
        if: steps.gate.outputs.submit == 'yes' && steps.creds.outputs.have == 'yes'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # --approval-timeout 0: upload + wait for validation only, don't block CI on human review.
          npx --yes web-ext@8 sign \
            --source-dir /tmp/ext \
            --artifacts-dir /tmp/ext-artifacts \
            --channel listed \
            --approval-timeout 0
          echo "## 🦊 Submitted extension ${{ steps.ver.outputs.version }} to AMO for review" >> "$GITHUB_STEP_SUMMARY"
          echo "Track it at https://addons.mozilla.org/en-US/developers/addon/downloader-browser-integration/versions" >> "$GITHUB_STEP_SUMMARY"
