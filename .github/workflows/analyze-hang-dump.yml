# Reads a hang dump produced by a CI test run and prints managed stacks to the log.
#
# The dumps `--blame-hang` writes are platform-native: `dotnet-dump analyze` refuses a Windows or macOS
# dump when it is running on Linux, so the recurring "test host hung" abort cannot be investigated from
# a Linux dev box at all. This job runs the analysis on the runner OS that produced the dump.
#
# Dispatch it with the id of the run whose artifact holds the dump, e.g.
#   gh workflow run analyze-hang-dump.yml -f run_id=34016675882
name: Analyze hang dump

# `workflow_dispatch` only works once this file is on the default branch, and this repo merges to main
# for releases only. The push trigger is scoped to THIS file so the job can be run from develop by
# committing the run id below — it can never fire for ordinary work.
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/analyze-hang-dump.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id whose test-results artifact holds the hang dump
        required: true
      artifact:
        description: Artifact name to download
        required: false
        default: test-results-windows-latest-Debug
      os:
        description: "Runner to analyse on — must match the OS that wrote the dump"
        required: false
        default: windows-latest
        type: choice
        options: [windows-latest, macos-latest, ubuntu-latest]

env:
  # Used by the push trigger, which cannot carry inputs. Change it to point the job at another run.
  DEFAULT_RUN_ID: '34609494951'
  DEFAULT_ARTIFACT: test-results-windows-latest-Debug

jobs:
  analyze:
    runs-on: ${{ inputs.os || 'windows-latest' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download the dump artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.run_id || env.DEFAULT_RUN_ID }} --repo ${{ github.repository }} -n ${{ inputs.artifact || env.DEFAULT_ARTIFACT }} -D dump

      - name: Install dotnet-dump
        run: dotnet tool install -g dotnet-dump

      - name: Analyse every dump in the artifact
        shell: bash
        run: |
          set -u
          export PATH="$PATH:$HOME/.dotnet/tools"
          found=0
          seen=""
          # The artifact carries each dump twice (the collector's own folder and the runner copy);
          # de-duplicate by file name so a 500 MB dump is not analysed twice.
          for dmp in $(find dump -name '*.dmp' | sort); do
            name=$(basename "$dmp")
            case " $seen " in *" $name "*) continue ;; esac
            seen="$seen $name"
            found=$((found + 1))
            echo "::group::pstacks — $name"
            dotnet-dump analyze "$dmp" -c "pstacks" -c "exit" || echo "pstacks failed for $name"
            echo "::endgroup::"
            echo "::group::clrthreads — $name"
            dotnet-dump analyze "$dmp" -c "clrthreads" -c "exit" || echo "clrthreads failed for $name"
            echo "::endgroup::"
            echo "::group::exceptions on the heap — $name"
            dotnet-dump analyze "$dmp" -c "dumpheap -stat -type Exception" -c "exit" 2>&1 | tail -60 \
              || echo "dumpheap failed for $name"
            echo "::endgroup::"
            echo "::group::headless session state — $name"
            # Was the session CANCELLED (i.e. disposed) or did its thread stop another way? The answer is
            # the CancellationTokenSource's _state field: 0 means never cancelled.
            # Resolve the EXACT type's method table first — a -type substring search also matches the
            # static Dictionary<Assembly, HeadlessUnitTestSession> that holds it.
            mt=$(dotnet-dump analyze "$dmp" -c "dumpheap -stat -type Avalonia.Headless.HeadlessUnitTestSession" -c "exit" \
                 2>/dev/null | tr -d '\r' \
                 | awk '$NF == "Avalonia.Headless.HeadlessUnitTestSession" {print $1}' | head -1)
            echo "method table: ${mt:-<not found>}"
            if [ -n "${mt:-}" ]; then
              for a in $(dotnet-dump analyze "$dmp" -c "dumpheap -short -mt $mt" -c "exit" 2>/dev/null \
                         | tr -d '\r' | grep -E '^[0-9a-f]{8,}$'); do
                echo "--- HeadlessUnitTestSession @ $a"
                dotnet-dump analyze "$dmp" -c "dumpobj $a" -c "exit" 2>&1 | tail -40
                fields=$(dotnet-dump analyze "$dmp" -c "dumpobj $a" -c "exit" 2>/dev/null | tr -d '\r')
                for f in _cancellationTokenSource _dispatchTask _queue; do
                  addr=$(echo "$fields" | awk -v n="$f" '$NF == n {print $(NF-1)}' | head -1)
                  if [ -n "${addr:-}" ] && [ "$addr" != "0000000000000000" ]; then
                    echo "--- $f @ $addr  (CTS _state 0 = never cancelled; Task m_stateFlags 0x200000 = FAULTED)"
                    dotnet-dump analyze "$dmp" -c "dumpobj $addr" -c "exit" 2>&1 | tail -35
                  fi
                done
                # The dispatch loop runs as a Task, so an escaping exception is CAPTURED on it rather
                # than crashing the process. Walk to that exception: it is what killed the session.
                task=$(echo "$fields" | awk '$NF == "_dispatchTask" {print $(NF-1)}' | head -1)
                follow() { dotnet-dump analyze "$dmp" -c "dumpobj $1" -c "exit" 2>/dev/null | tr -d '\r' \
                           | awk -v n="$2" '$NF == n {print $(NF-1)}' | head -1; }
                if [ -n "${task:-}" ]; then
                  cp_=$(follow "$task" m_contingentProperties)
                  echo "--- contingent properties @ ${cp_:-<none>}"
                  [ -n "${cp_:-}" ] && dotnet-dump analyze "$dmp" -c "dumpobj $cp_" -c "exit" 2>&1 | tail -25
                  hold=$(follow "${cp_:-0}" m_exceptionsHolder)
                  echo "--- exceptions holder @ ${hold:-<none>}"
                  [ -n "${hold:-}" ] && dotnet-dump analyze "$dmp" -c "dumpobj $hold" -c "exit" 2>&1 | tail -25
                  faults=$(follow "${hold:-0}" m_faultExceptions)
                  echo "--- fault exceptions list @ ${faults:-<none>}"
                  [ -n "${faults:-}" ] && dotnet-dump analyze "$dmp" -c "dumpobj $faults" -c "exit" 2>&1 | tail -20
                  items=$(follow "${faults:-0}" _items)
                  echo "--- list backing array @ ${items:-<none>}"
                  if [ -n "${items:-}" ]; then
                    dotnet-dump analyze "$dmp" -c "dumparray $items" -c "exit" 2>&1 | tail -20
                    edi=$(dotnet-dump analyze "$dmp" -c "dumparray $items" -c "exit" 2>/dev/null | tr -d '\r' \
                          | awk '/^\[0\]/ {print $2}' | head -1)
                    echo "--- ExceptionDispatchInfo @ ${edi:-<none>}"
                    if [ -n "${edi:-}" ]; then
                      dotnet-dump analyze "$dmp" -c "dumpobj $edi" -c "exit" 2>&1 | tail -20
                      exc=$(follow "$edi" _exception)
                      echo "=== THE EXCEPTION THAT KILLED THE SESSION @ ${exc:-<none>} ==="
                      [ -n "${exc:-}" ] && dotnet-dump analyze "$dmp" -c "printexception -nested $exc" -c "exit" 2>&1 | tail -60
                    fi
                  fi
                fi
              done
            fi
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No .dmp files in the artifact — nothing to analyse."
            exit 1
          fi
