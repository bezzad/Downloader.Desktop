name: Release

# Builds self-contained, dependency-free executables for Windows, Linux and macOS and attaches
# them to the GitHub Release. End users just download, unzip and run — no .NET, FFmpeg or anything
# else to install. Triggers when a version tag (v*) is pushed, or manually.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: Downloader-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Downloader-linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: Downloader-osx-arm64
          # osx-x64 is built on Linux on purpose: .NET cross-publishes the macOS-x64 runtime pack
          # (no native compilation step), and GitHub's Intel-Mac (macos-13) runners are scarce and
          # can sit queued for hours. Building it here avoids that wait. osx-arm64 stays on a Mac
          # runner (Apple-Silicon runners are plentiful and fast).
          - os: ubuntu-latest
            rid: osx-x64
            artifact: Downloader-osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          # Stamp the version from the tag (v1.2.3 -> 1.2.3) so the built app reports exactly the
          # released version and the in-app update check doesn't false-alarm. Non-tag runs use the csproj default.
          VER_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER_ARG="-p:VersionPrefix=${GITHUB_REF_NAME#v}"; fi
          # macOS: do NOT use single-file/compression. The compressed single-file bundle crashes on
          # Apple Silicon the first time a managed assembly is loaded (inflate -> Data Abort / SIGABRT,
          # e.g. when a download starts). Ship a normal .app folder with loose assemblies/dylibs instead
          # (make-macos-app.sh bundles the whole publish dir). Windows/Linux keep single-file.
          PKG_ARGS="-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true"
          if [[ "${{ matrix.rid }}" == osx-* ]]; then PKG_ARGS=""; fi
          dotnet publish src/Downloader.Desktop/Downloader.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            $PKG_ARGS \
            -p:DebugType=None -p:DebugSymbols=false \
            $VER_ARG \
            -o publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          OUT="publish/${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            [ -f "$OUT/Downloader.Desktop.exe" ] && mv -f "$OUT/Downloader.Desktop.exe" "$OUT/Downloader.exe"
            (cd "$OUT" && 7z a "../../${{ matrix.artifact }}.zip" ./* >/dev/null)
          elif [[ "${{ matrix.rid }}" == osx-* ]]; then
            # macOS ships a proper .app bundle so the app appears in Spotlight/Launchpad and
            # launches detached (a bare Unix binary does neither). Version comes from the tag (v1.2.3 -> 1.2.3).
            [ -f "$OUT/Downloader.Desktop" ] && mv -f "$OUT/Downloader.Desktop" "$OUT/Downloader"
            VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0"
            scripts/make-macos-app.sh "$OUT" "$OUT-app" "$VERSION"
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$OUT-app" Downloader.app
          else
            [ -f "$OUT/Downloader.Desktop" ] && mv -f "$OUT/Downloader.Desktop" "$OUT/Downloader"
            chmod +x "$OUT/Downloader" || true
            # Ship the app icon next to the binary so the Linux installer can register it for the
            # app menu / taskbar (a raw ELF can't carry one).
            cp -f src/Downloader.Desktop/Assets/downloader.png "$OUT/downloader.png" || true
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$OUT" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: false
          # NOTE: do NOT set generate_release_notes here. With 4 matrix jobs each creating the release
          # concurrently, that made creation non-idempotent → "tag_name already_exists" and one job
          # (osx-x64) failed to upload its asset. Notes are stamped once by the separate `notes` job below
          # (and scripts/release.sh sets curated notes on top).

  # Build the OPTIONAL (catalog-tier) plugins and attach them + plugins-catalog.json to the same release.
  # Optional plugins (HLS, future torrent) are NOT bundled in the app — they ship only here and the app
  # downloads+verifies (sha256) them on demand (see the consolidate-official-plugins change). Runs AFTER
  # the app matrix so the release already exists (same create-race avoidance as `extension` below).
  # Also asserts the app's own publish output never contains an optional-plugin DLL, so the build/publish
  # isolation can't silently regress (the compile-time guard is PluginIsolationTests).
  plugins:
    name: Attach optional plugins + catalog
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Isolation guard — app publish output must not contain an optional plugin
        shell: bash
        run: |
          dotnet publish src/Downloader.Desktop/Downloader.Desktop.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:DebugType=None -p:DebugSymbols=false -o publish/isolation-check
          if find publish/isolation-check \( -iname 'Downloader.Desktop.Plugins.Hls*' -o -iname 'Downloader.Desktop.Plugins.Website*' -o -iname 'Downloader.Desktop.Plugins.SiteMedia*' \) | grep -q .; then
            echo "::error::optional plugin leaked into the app publish output"; exit 1
          fi
          echo "OK: no optional-plugin assemblies in the app publish output."

      - name: Build optional plugin zips + catalog
        run: ./scripts/build-plugins.sh dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/plugins-catalog.json
          fail_on_unmatched_files: true
          # No generate_release_notes here — the release exists by now (see the notes job).

  # Attach the browser-extension store zips + extension-catalog.json to the same release. The zips serve
  # the manual Chrome/Edge dashboard upload; the CATALOG is what the running app reads to offer the
  # extension for install (Settings -> Install browser extension), which is why its checksums are derived
  # from these exact zips by build-extension.sh rather than written by hand. Runs AFTER the app matrix so the
  # release already exists — a concurrent create here would reintroduce the "tag_name already_exists"
  # race (see the note above). Store uploads (AMO / Chrome / Edge) are manual dashboard uploads
  # of these zips — the automated AMO workflow was removed 2026-08-24.
  extension:
    name: Attach extension zips + catalog
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zips + catalog
        run: ./scripts/build-extension.sh

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/downloader-extension-chrome.zip
            dist/downloader-extension-firefox.zip
            dist/extension-catalog.json
          fail_on_unmatched_files: true
          # No generate_release_notes here either — the release exists by now; notes are handled below.

  # Debian package + signed APT repo on GitHub Pages, so users can `apt install downloader`.
  # Requires: repo Settings → Pages → Source = "GitHub Actions", and an APT_GPG_PRIVATE_KEY secret
  # (the armored private key whose public half is packaging/apt/pubkey.gpg).
  deb:
    name: Debian package + APT repo
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Job-level so step `if:` can gate on it (step-scoped env isn't visible to its own `if`).
      APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Download the released linux-x64 tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pub
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -p 'Downloader-linux-x64.tar.gz' -O linux.tar.gz
          tar -xzf linux.tar.gz -C pub

      - name: Build the .deb
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-deb.sh pub

      - name: Attach the .deb to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Downloader_*_amd64.deb
          fail_on_unmatched_files: true

      - name: Import the APT signing key
        if: env.APT_KEY != ''
        run: |
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$APT_KEY" | gpg --batch --import

      - name: Build the signed APT repo
        if: env.APT_KEY != ''
        run: |
          mkdir -p _site
          cp packaging/apt/pubkey.gpg _site/pubkey.gpg
          echo '<!doctype html><meta charset=utf-8><title>Downloader APT repo</title><h1>Downloader APT repository</h1><p>See <a href="https://github.com/bezzad/Downloader.Desktop#-linux">install instructions</a>.</p>' > _site/index.html
          APT_GPG_PUBKEY=packaging/apt/pubkey.gpg ./scripts/build-apt-repo.sh _site/apt dist/Downloader_*_amd64.deb

      - name: Upload Pages artifact
        if: env.APT_KEY != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        if: env.APT_KEY != ''
        uses: actions/deploy-pages@v4

  # Windows MSIX package (self-signed, for sideload testing). Store submission is author-gated and done
  # from Partner Center (see packaging/msix/README.md); this only produces + uploads the .msix artifact.
  aur:
    name: AUR (downloader-bin)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Job-level so the step `if:` can gate on it (step-scoped env isn't visible to its own `if`).
      # Add the AUR account's PRIVATE ssh key (whose public half is registered at
      # aur.archlinux.org -> My Account) as the repo secret AUR_SSH_PRIVATE_KEY to enable this.
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Checksum the released linux-x64 tarball
        if: env.AUR_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -p 'Downloader-linux-x64.tar.gz' -O linux.tar.gz
          echo "LIN_SHA=$(sha256sum linux.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"

      # The tag's tree still carries the PREVIOUS version (release.sh commits the mirror bump to
      # develop only after tagging), so rewrite here from the tag + the real asset checksum.
      - name: Rewrite PKGBUILD/.SRCINFO for this tag
        if: env.AUR_KEY != ''
        run: ./scripts/bump-aur.sh "${GITHUB_REF_NAME#v}" "$LIN_SHA"

      - name: Publish to the AUR
        if: env.AUR_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes"

          git clone --quiet ssh://aur@aur.archlinux.org/downloader-bin.git aur-pkg
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-pkg/
          cd aur-pkg
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "AUR package already at ${GITHUB_REF_NAME#v} — nothing to push"; exit 0
          fi
          git -c user.name='bezzad' -c user.email='behzad.khosravifar@gmail.com' \
              commit -aqm "downloader-bin ${GITHUB_REF_NAME#v}"
          git push --quiet
          echo "Published downloader-bin ${GITHUB_REF_NAME#v} to the AUR"

      - name: Note when the AUR secret is absent
        if: env.AUR_KEY == ''
        run: echo "::warning::AUR_SSH_PRIVATE_KEY is not set — skipping the AUR publish."

  msix:
    name: Windows MSIX (self-signed)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the released win-x64 zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" -p 'Downloader-win-x64.zip' -O win.zip
          Expand-Archive win.zip -DestinationPath pub -Force
        shell: pwsh

      - name: Build + self-sign the MSIX
        run: ./scripts/build-msix.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v')) -PublishDir pub
        shell: pwsh

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Downloader-msix
          path: |
            dist/msix/*.msix
            dist/msix/*.cer

  # Single post-matrix job that guarantees notes WITHOUT the create-race above: it runs once after all
  # builds and only fills in GitHub's auto "What's Changed" if the body is still empty — so it never
  # clobbers the curated notes that scripts/release.sh sets.
  notes:
    name: Ensure release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Fill notes if empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)
          if [ -z "$body" ]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq '.body')
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$notes"
            echo "Filled auto-generated notes."
          else
            echo "Release already has notes — leaving them as-is."
          fi
