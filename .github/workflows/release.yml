name: Release

# Builds self-contained, dependency-free executables for Windows, Linux and macOS and attaches
# them to the GitHub Release. End users just download, unzip and run — no .NET, FFmpeg or anything
# else to install. Triggers when a version tag (v*) is pushed, or manually.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: Downloader-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Downloader-linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: Downloader-osx-arm64
          # osx-x64 is built on Linux on purpose: .NET cross-publishes the macOS-x64 runtime pack
          # (no native compilation step), and GitHub's Intel-Mac (macos-13) runners are scarce and
          # can sit queued for hours. Building it here avoids that wait. osx-arm64 stays on a Mac
          # runner (Apple-Silicon runners are plentiful and fast).
          - os: ubuntu-latest
            rid: osx-x64
            artifact: Downloader-osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          # Stamp the version from the tag (v1.2.3 -> 1.2.3) so the built app reports exactly the
          # released version and the in-app update check doesn't false-alarm. Non-tag runs use the csproj default.
          VER_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER_ARG="-p:VersionPrefix=${GITHUB_REF_NAME#v}"; fi
          # macOS: do NOT use single-file/compression. The compressed single-file bundle crashes on
          # Apple Silicon the first time a managed assembly is loaded (inflate -> Data Abort / SIGABRT,
          # e.g. when a download starts). Ship a normal .app folder with loose assemblies/dylibs instead
          # (make-macos-app.sh bundles the whole publish dir). Windows/Linux keep single-file.
          PKG_ARGS="-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true"
          if [[ "${{ matrix.rid }}" == osx-* ]]; then PKG_ARGS=""; fi
          dotnet publish src/Downloader.Desktop/Downloader.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            $PKG_ARGS \
            -p:DebugType=None -p:DebugSymbols=false \
            $VER_ARG \
            -o publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          OUT="publish/${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            [ -f "$OUT/Downloader.Desktop.exe" ] && mv -f "$OUT/Downloader.Desktop.exe" "$OUT/Downloader.exe"
            (cd "$OUT" && 7z a "../../${{ matrix.artifact }}.zip" ./* >/dev/null)
          elif [[ "${{ matrix.rid }}" == osx-* ]]; then
            # macOS ships a proper .app bundle so the app appears in Spotlight/Launchpad and
            # launches detached (a bare Unix binary does neither). Version comes from the tag (v1.2.3 -> 1.2.3).
            [ -f "$OUT/Downloader.Desktop" ] && mv -f "$OUT/Downloader.Desktop" "$OUT/Downloader"
            VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0"
            scripts/make-macos-app.sh "$OUT" "$OUT-app" "$VERSION"
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$OUT-app" Downloader.app
          else
            [ -f "$OUT/Downloader.Desktop" ] && mv -f "$OUT/Downloader.Desktop" "$OUT/Downloader"
            chmod +x "$OUT/Downloader" || true
            # Ship the app icon next to the binary so the Linux installer can register it for the
            # app menu / taskbar (a raw ELF can't carry one).
            cp -f src/Downloader.Desktop/Assets/downloader.png "$OUT/downloader.png" || true
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$OUT" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: false
