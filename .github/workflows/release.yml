name: Release

# Builds self-contained, dependency-free executables for Windows, Linux and macOS and attaches
# them to the GitHub Release. End users just download, unzip and run — no .NET, FFmpeg or anything
# else to install. Triggers when a version tag (v*) is pushed, or manually.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: Downloader-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Downloader-linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: Downloader-osx-arm64
          # osx-x64 is built on Linux on purpose: .NET cross-publishes the macOS-x64 runtime pack
          # (no native compilation step), and GitHub's Intel-Mac (macos-13) runners are scarce and
          # can sit queued for hours. Building it here avoids that wait. osx-arm64 stays on a Mac
          # runner (Apple-Silicon runners are plentiful and fast).
          - os: ubuntu-latest
            rid: osx-x64
            artifact: Downloader-osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          # Stamp the version from the tag (v1.2.3 -> 1.2.3) so the built app reports exactly the
          # released version and the in-app update check doesn't false-alarm. Non-tag runs use the csproj default.
          VER_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER_ARG="-p:VersionPrefix=${GITHUB_REF_NAME#v}"; fi
          # macOS: do NOT use single-file/compression. The compressed single-file bundle crashes on
          # Apple Silicon the first time a managed assembly is loaded (inflate -> Data Abort / SIGABRT,
          # e.g. when a download starts). Ship a normal .app folder with loose assemblies/dylibs instead
          # (make-macos-app.sh bundles the whole publish dir). Windows/Linux keep single-file.
          PKG_ARGS="-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true"
          if [[ "${{ matrix.rid }}" == osx-* ]]; then PKG_ARGS=""; fi
          dotnet publish src/Downloader.Desktop/Downloader.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            $PKG_ARGS \
            -p:DebugType=None -p:DebugSymbols=false \
            $VER_ARG \
            -o publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          OUT="publish/${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            [ -f "$OUT/Downloader.Desktop.exe" ] && mv -f "$OUT/Downloader.Desktop.exe" "$OUT/Downloader.exe"
            (cd "$OUT" && 7z a "../../${{ matrix.artifact }}.zip" ./* >/dev/null)
          elif [[ "${{ matrix.rid }}" == osx-* ]]; then
            # macOS ships a proper .app bundle so the app appears in Spotlight/Launchpad and
            # launches detached (a bare Unix binary does neither). Version comes from the tag (v1.2.3 -> 1.2.3).
            [ -f "$OUT/Downloader.Desktop" ] && mv -f "$OUT/Downloader.Desktop" "$OUT/Downloader"
            VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0"
            scripts/make-macos-app.sh "$OUT" "$OUT-app" "$VERSION"
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$OUT-app" Downloader.app
          else
            [ -f "$OUT/Downloader.Desktop" ] && mv -f "$OUT/Downloader.Desktop" "$OUT/Downloader"
            chmod +x "$OUT/Downloader" || true
            # Ship the app icon next to the binary so the Linux installer can register it for the
            # app menu / taskbar (a raw ELF can't carry one).
            cp -f src/Downloader.Desktop/Assets/downloader.png "$OUT/downloader.png" || true
            tar -czf "${{ matrix.artifact }}.tar.gz" -C "$OUT" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: false
          # NOTE: do NOT set generate_release_notes here. With 4 matrix jobs each creating the release
          # concurrently, that made creation non-idempotent → "tag_name already_exists" and one job
          # (osx-x64) failed to upload its asset. Notes are stamped once by the separate `notes` job below
          # (and scripts/release.sh sets curated notes on top).

  # Build the OPTIONAL (catalog-tier) plugins and attach them + plugins-catalog.json to the same release.
  # Optional plugins (HLS, future torrent) are NOT bundled in the app — they ship only here and the app
  # downloads+verifies (sha256) them on demand (see the consolidate-official-plugins change). Runs AFTER
  # the app matrix so the release already exists (same create-race avoidance as `extension` below).
  # Also asserts the app's own publish output never contains an optional-plugin DLL, so the build/publish
  # isolation can't silently regress (the compile-time guard is PluginIsolationTests).
  plugins:
    name: Attach optional plugins + catalog
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Isolation guard — app publish output must not contain an optional plugin
        shell: bash
        run: |
          dotnet publish src/Downloader.Desktop/Downloader.Desktop.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:DebugType=None -p:DebugSymbols=false -o publish/isolation-check
          if find publish/isolation-check -iname 'Downloader.Desktop.Plugins.Hls*' | grep -q .; then
            echo "::error::optional plugin leaked into the app publish output"; exit 1
          fi
          echo "OK: no optional-plugin assemblies in the app publish output."

      - name: Build optional plugin zips + catalog
        run: ./scripts/build-plugins.sh dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/plugins-catalog.json
          fail_on_unmatched_files: true
          # No generate_release_notes here — the release exists by now (see the notes job).

  # Attach the browser-extension store zips to the same release so users (and the manual Chrome/Edge
  # dashboard upload) can grab the build matching this version. Runs AFTER the app matrix so the
  # release already exists — a concurrent create here would reintroduce the "tag_name already_exists"
  # race (see the note above). Firefox publishing to AMO is automated separately (extension.yml).
  extension:
    name: Attach extension zips
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zips
        run: ./scripts/build-extension.sh

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/downloader-extension-chrome.zip
            dist/downloader-extension-firefox.zip
          fail_on_unmatched_files: true
          # No generate_release_notes here either — the release exists by now; notes are handled below.

  # Single post-matrix job that guarantees notes WITHOUT the create-race above: it runs once after all
  # builds and only fills in GitHub's auto "What's Changed" if the body is still empty — so it never
  # clobbers the curated notes that scripts/release.sh sets.
  notes:
    name: Ensure release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fill notes if empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)
          if [ -z "$body" ]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq '.body')
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$notes"
            echo "Filled auto-generated notes."
          else
            echo "Release already has notes — leaving them as-is."
          fi
