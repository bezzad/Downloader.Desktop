<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Downloader — fast multi-connection download manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3B4A"/>
      <stop offset="0.5" stop-color="#0E8FB3"/>
      <stop offset="1" stop-color="#2DBED6"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D6F2F8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00131A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <!-- subtle connection "speed lines" -->
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="14" stroke-linecap="round">
    <line x1="760" y1="86" x2="1180" y2="86"/>
    <line x1="700" y1="140" x2="1180" y2="140"/>
    <line x1="800" y1="194" x2="1180" y2="194"/>
    <line x1="720" y1="248" x2="1180" y2="248"/>
    <line x1="820" y1="302" x2="1180" y2="302"/>
  </g>

  <!-- logo: download arrow into a tray -->
  <g transform="translate(120 96)" filter="url(#soft)">
    <circle cx="84" cy="84" r="84" fill="#FFFFFF" fill-opacity="0.12"/>
    <g fill="url(#disc)">
      <rect x="70" y="26" width="28" height="74" rx="14"/>
      <path d="M44 78 L84 124 L124 78 Z"/>
    </g>
    <rect x="44" y="128" width="80" height="16" rx="8" fill="url(#disc)"/>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="320" y="170" font-size="86" font-weight="700" fill="#FFFFFF">Downloader</text>
    <text x="324" y="226" font-size="32" font-weight="400" fill="#EAF7FB" fill-opacity="0.92">Fast, multi-connection download manager</text>
    <text x="324" y="276" font-size="22" font-weight="600" fill="#BfeaF3" letter-spacing="2">WINDOWS  ·  macOS  ·  LINUX</text>
  </g>
</svg>
