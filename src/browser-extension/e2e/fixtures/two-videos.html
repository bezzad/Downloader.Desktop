<!doctype html>
<html><body>
<!-- An x.com-shaped feed: two DIFFERENT videos whose players never name the URL they play (on x.com
     the <video> plays a blob:), each with a poster that carries the same media id as its file's path.
     Player A is first on the page and larger; the popup lists B first (it names a quality). Pairing
     pictures by position — the reported bug — therefore gives each row the OTHER video's poster.
     The players are deliberately never loaded, so the poster (and its id) is all there is. -->
<video id="a" width="480" height="270"
  poster="/amplify_video_thumb/1712345678901234567/img/thumbA.jpg"></video>
<video id="b" width="320" height="180"
  poster="/amplify_video_thumb/1798765432109876543/img/thumbB.jpg"></video>
<script>
  fetch('/amplify_video/1712345678901234567/vid/main_video.mp4');
  fetch('/amplify_video/1798765432109876543/vid/videos/alpha_360p.mp4');
</script>
</body></html>
