<!doctype html>
<html><body>
<!-- Reproduces the exact x.com shape: a video that plays briefly then is left PAUSED on a frame.
     It must be listed like any other detection — playback state no longer decides anything. -->
<video id="v" src="/main_video.mp4" muted playsinline width="320" height="240"></video>
<script>
  const v = document.getElementById('v');
  v.play().then(() => setTimeout(() => v.pause(), 300));
</script>
</body></html>
