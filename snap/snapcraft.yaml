name: downloader
base: core22
adopt-info: version
icon: snap/gui/downloader.png   # snap Store + `snap info` icon (the .desktop Icon= only covers the launcher)
summary: Fast multi-connection download manager
description: |
  Downloader is a free, open-source, cross-platform download manager built on the
  multi-connection Downloader engine. It splits each file into parts for faster downloads,
  supports pause/resume, queues, a scheduler, speed limits, and mirror fallbacks.

  Updates are delivered automatically through the Snap Store (the in-app updater is disabled
  in the snap build).

grade: stable
confinement: strict
compression: lzo

apps:
  downloader:
    command: bin/Downloader
    extensions: [gnome]   # provides graphics/fonts/theme + desktop integration (GTK/mesa/fontconfig)
    plugs:
      - home              # save to the user's folders
      - removable-media   # save to external/USB drives
      - network           # download
      - network-bind      # local listeners (browser integration + single-instance lock)
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - unity7
      - gsettings
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
      # The single-file build self-extracts native libs (libSkiaSharp.so, …) on first run.
      # Its default target is ~/.cache/dotnet_bundle_extract, but under strict confinement the
      # `home` interface denies hidden dot-dirs like ~/.cache → EACCES (error 13) and the app
      # never launches. Point extraction at $SNAP_USER_COMMON, which is always writable here.
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.dotnet_bundle_extract

parts:
  # Sets the snap version from snap/local/VERSION (written by scripts/build-snap.sh / CI).
  version:
    plugin: nil
    override-pull: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/snap/local/VERSION" 2>/dev/null || echo 0.0.0)"

  # Dumps the self-contained, single-file linux-x64 publish output (produced before packing).
  downloader:
    after: [version]
    plugin: dump
    source: publish/linux-x64
    organize:
      Downloader: bin/Downloader
      # StageBundledPlugins (Downloader.Desktop.csproj) writes built-in plugin DLLs to
      # publish/linux-x64/plugins/. PluginManager looks for them next to the executable
      # (AppContext.BaseDirectory/plugins), so they must land under bin/ too — otherwise
      # they're silently skipped (Directory.Exists check, no error) and no built-in
      # plugin (Ollama, GitHub) loads in the snap build.
      plugins: bin/plugins
    stage-packages:
      - libicu70
      - libssl3
